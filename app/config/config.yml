imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }
    - { resource: sonata/block.yml }
    - { resource: sonata/admin.yml }
    - { resource: sonata/user.yml }
    - { resource: sonata/intl.yml }
    - { resource: sonata/seo.yml }
    - { resource: sonata/page.yml }
    - { resource: fos/ckeditor.yml }
    - { resource: lexik/translation.yml }
    - { resource: a2lix/translation-form.yml }
    - { resource: symfony-cmf/cmf-routing.yml }
    - { resource: jms/i18n_routing.yml }
    - { resource: liip/imagine.yml }
    - { resource: knplabs/gaufrette.yml }
    - { resource: oneup/oneup-upload.yml }
    - { resource: doctrine/migrations.yml }
    - { resource: shortcode/shortcode.yml }
    - { resource: vich/vich_uploader.yml }
#    - { resource: sentry/sentry.yml }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: uk
    locales: [uk, ru]
    route_locales: ru|ua|uk
    routes_for_admin: ru|uk|ua
    replacement_locales: [{ from: uk, to: ua }]

framework:
    #esi: ~
    translator: { fallbacks: ['%locale%'] }
#    translator: { fallbacks: ['%locale%'] }
    secret: '%secret%'
    router:
        resource: '%kernel.project_dir%/app/config/routing.yml'
        strict_requirements: ~
    form: ~
    csrf_protection: ~
    validation: { enable_annotations: true }
    serializer: { enable_annotations: true }
    property_info: { enabled: true }
    default_locale: '%locale%'
    trusted_hosts: ~
    session:
        # https://symfony.com/doc/current/reference/configuration/framework.html#handler-id
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
    fragments: ~
    http_method_override: true
    assets: ~
    php_errors:
        log: true

# Twig Configuration
twig:
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    globals:
        locales_list: "%locales%"
        company_name: '%company_name%'
    paths:
        '%kernel.project_dir%/app/Resources/AppBundle/views': App
        '%kernel.project_dir%/app/Resources/ArticleBundle/views': Article
        '%kernel.project_dir%/app/Resources/BookBundle/views': Book
        '%kernel.project_dir%/app/Resources/CommentBundle/views': Comment
        '%kernel.project_dir%/app/Resources/InformationBundle/views': Information
        '%kernel.project_dir%/app/Resources/MainImageBundle/views': MainImage
        '%kernel.project_dir%/app/Resources/OrderBundle/views': Order
        '%kernel.project_dir%/app/Resources/ProductBundle/views': Product
        '%kernel.project_dir%/app/Resources/ShareBundle/views': Share
        '%kernel.project_dir%/app/Resources/WheelSpinBundle/views': WheelSpin
        '%kernel.project_dir%/app/Resources/SonataUserBundle/views': SonataUser
    form_themes:
        - '@Admin/Form/fields.html.twig'
        - '@SonataForm/Form/datepicker.html.twig'
        - '@FOSCKEditor/Form/ckeditor_widget.html.twig'


# Doctrine Configuration
doctrine:
    dbal:
        server_version: '%server_version%'
        driver: pdo_mysql
        host: '%database_host%'
        port: '%database_port%'
        dbname: '%database_name%'
        user: '%database_user%'
        password: '%database_password%'
        charset: UTF8

    orm:
        default_entity_manager: default
        auto_generate_proxy_classes: "%kernel.debug%"
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore
                auto_mapping: true
                mappings:
                    SonataPageBundle: ~
                dql:
                    numeric_functions:
                        rand: DoctrineExtensions\Query\Mysql\Rand


sensio_framework_extra:
    router:
        annotations: false

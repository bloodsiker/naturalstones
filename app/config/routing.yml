# =============================================================================

# Remove trailing slash =======================================================
remove_trailing_slash:
    path: /{url}
    defaults: { _controller: AppBundle\Controller\DefaultController::removeTrailingSlashAction }
    requirements:
        url: .*/$
    methods: [GET]

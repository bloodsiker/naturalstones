# User auth & cabinet =========================================================
login:
    path: /login
    defaults:
        _controller: AppBundle\Controller\SecurityController::loginAction
    options: { i18n: false }

logout:
    path: /logout
    defaults:
        _controller: AppBundle\Controller\SecurityController::logoutAction
    options: { i18n: false }

register:
    path: /register
    defaults:
        _controller: AppBundle\Controller\SecurityController::registerAction
    options: { i18n: false }

cabinet:
    path: /cabinet
    defaults:
        _controller: AppBundle\Controller\CabinetController::indexAction
    options: { i18n: false }

cabinet_profile:
    path: /cabinet/profile
    defaults:
        _controller: AppBundle\Controller\CabinetController::profileAction
    options: { i18n: false }

cabinet_favorites:
    path: /cabinet/favorites
    defaults:
        _controller: AppBundle\Controller\CabinetController::favoritesAction
    options: { i18n: false }

cabinet_addresses:
    path: /cabinet/addresses
    defaults:
        _controller: AppBundle\Controller\CabinetController::addressesAction
    options: { i18n: false }

cabinet_address_default:
    path: /cabinet/addresses/{id}/default
    defaults:
        _controller: AppBundle\Controller\CabinetController::addressDefaultAction
    options: { i18n: false }
    methods: [POST]

cabinet_address_delete:
    path: /cabinet/addresses/{id}/delete
    defaults:
        _controller: AppBundle\Controller\CabinetController::addressDeleteAction
    options: { i18n: false }
    methods: [POST]

cabinet_order_show:
    path: /cabinet/order/{secret}
    defaults:
        _controller: AppBundle\Controller\CabinetController::orderAction
    options: { i18n: false }

favorite_toggle:
    path: /favorite/toggle/{id}
    defaults:
        _controller: AppBundle\Controller\CabinetController::toggleFavoriteAction
    options: { i18n: false }
    methods: [POST]

favorite_ids:
    path: /favorite/ids
    defaults:
        _controller: AppBundle\Controller\CabinetController::favoriteIdsAction
    options: { i18n: false }
    methods: [GET]
# =============================================================================

# Application =================================================================
index:
    path: /
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
        _controller: AppBundle\Controller\DefaultController::indexAction

app:
    resource: '@AppBundle/Resources/config/routing.yml'
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
#==============================================================================

# Product =====================================================================
product:
    resource: '@ProductBundle/Resources/config/routing.yml'
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
#==============================================================================

# Article =====================================================================
article:
    resource: '@ArticleBundle/Resources/config/routing.yml'
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
#==============================================================================

# Order ========================================================================
order:
    resource: '@OrderBundle/Resources/config/routing.yml'
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
#==============================================================================

# Share ========================================================================
share:
    resource: '@ShareBundle/Resources/config/routing.yml'
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
#==============================================================================

# Comments ========================================================================
reviews:
    resource: '@CommentBundle/Resources/config/routing.yml'
    requirements:
        _locale: '%route_locales%'
    defaults:
        _locale: '%locale%'
#==============================================================================

sitemap:
    path: /sitemap.{_format}
    defaults:
        _controller: AppBundle\Controller\DefaultController::sitemapAction
    requirements:
        _format: "xml"
    options: { i18n: false }

facebook_feed:
    path: /facebookfeed.{_format}
    defaults:
        _controller: AppBundle\Controller\DefaultController::generateFeedAction
    requirements:
        _format: "csv"
    options: { i18n: false }

opensearch:
    path: /opensearch.{_format}
    defaults:
        _format: "xml"
        _controller: AppBundle\Controller\DefaultController::openSearchAction
    requirements:
        _format: "xml"
    options: { i18n: false }

# Sonata Admin ================================================================
sonata_user_admin_security:
    resource: '@SonataUserBundle/Resources/config/routing/admin_security.xml'
    prefix: /admin

sonata_user_admin_resetting:
    resource: '@SonataUserBundle/Resources/config/routing/admin_resetting.xml'
    prefix: /admin/resetting

admin_area:
    resource: '@SonataAdminBundle/Resources/config/routing/sonata_admin.xml'
    prefix: /admin

_sonata_admin:
    resource: .
    type: sonata_admin
    prefix: /admin
# =============================================================================

# Sonata Page =================================================================
sonata_page_exceptions:
    resource: '@SonataPageBundle/Resources/config/routing/exceptions.xml'
    prefix: /
# =============================================================================


# Liip Imagine ================================================================
#_liip_imagine:

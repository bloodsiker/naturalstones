security:

    providers:
        in_memory:
            memory: ~
        sonata_user_provider:
            id: sonata.user.security.user_provider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern:            /admin(.*)
            context:            user
            form_login:
                provider:       sonata_user_provider
                login_path:     sonata_user_admin_security_login
                use_forward:    false
                check_path:     sonata_user_admin_security_check
                failure_path:   null
                default_target_path: sonata_admin_dashboard
                always_use_default_target_path: true
            logout:
                path:           sonata_user_admin_security_logout
                target:         /admin/login
            switch_user:        { provider: sonata_user_provider }
            anonymous:          true

        main:
            pattern:             .*
            context:             user
            guard:
                provider: sonata_user_provider
                authenticators:
                    - AppBundle\Security\LoginFormAuthenticator
            form_login:
                provider: sonata_user_provider
                csrf_token_generator: security.csrf.token_manager
                check_path: app_login_check
                success_handler: app.security.authentication_handler
                failure_handler: app.security.authentication_handler
            logout:
                path:   logout
                target: index
            anonymous:          true

    password_hashers:
        UserBundle\Entity\User:
            algorithm: sha512

    access_control:
        - { path: ^/admin/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/logout$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/login_check$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/resetting, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin/, role: [ROLE_ADMIN, ROLE_SONATA_ADMIN] }
        - { path: ^/.*, role: IS_AUTHENTICATED_ANONYMOUSLY }

    role_hierarchy:
        ROLE_ADMIN:       [ROLE_USER, ROLE_SONATA_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_USER, ROLE_SONATA_ADMIN, ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH, SONATA]
# Learn more about services, parameters and containers at
# https://symfony.com/doc/current/service_container.html
parameters:
    #parameter_name: value

services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # makes classes in src/AppBundle available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    AppBundle\:
        resource: '../../src/AppBundle/*'
        exclude: '../../src/AppBundle/{Block,Builder,DependencyInjection,Entity,EventSubscriber,Handler,Helper,Repository,Services,Template,Tests,Traits}'

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    AppBundle\Controller\:
        resource: '../../src/AppBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    AdminBundle\Controller\:
        resource: '../../src/AdminBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    Sonata\BlockBundle\Block\BlockContextManagerInterface: '@sonata.block.context_manager.default'
    Sonata\BlockBundle\Block\BlockRendererInterface: '@sonata.block.renderer.default'

    ProductBundle\Controller\:
        resource: '../../src/ProductBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    ArticleBundle\Controller\:
        resource: '../../src/ArticleBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    CommentBundle\Controller\:
        resource: '../../src/CommentBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    OrderBundle\Controller\:
        resource: '../../src/OrderBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    BookBundle\Controller\:
        resource: '../../src/BookBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    ShareBundle\Controller\:
        resource: '../../src/ShareBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    AdminBundle\Controller\CRUDController:
        public: true
        tags: ['controller.service_arguments']

    ArticleBundle\Controller\ArticleAdminController:
        public: true
        tags: ['controller.service_arguments']

    BookBundle\Controller\BookAdminController:
        public: true
        tags: ['controller.service_arguments']

    MediaBundle\Controller\MediaAdminController:
        public: true
        tags: ['controller.service_arguments']

    ProductBundle\Controller\ProductAdminController:
        public: true
        tags: ['controller.service_arguments']

    ShareBundle\Controller\TextAdminController:
        public: true
        tags: ['controller.service_arguments']

    # add more services, or override services that need manual wiring
    # AppBundle\Service\ExampleService:
    #     arguments:
    #         $someArgument: 'some_value'

    app.exception.locale_listener:
        class: "AppBundle\\EventSubscriber\\ExceptionListener"
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.exception', method: 'onKernelException', priority: -126 }
        calls:
            - [ 'setDefaultLocale', [ '%kernel.default_locale%' ] ]
            - [ 'setTranslator', [ '@translator' ] ]

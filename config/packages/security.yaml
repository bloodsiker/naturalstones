security:
    providers:
        in_memory:
            memory: ~
        sonata_user_provider:
            id: sonata.user.security.user_provider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: /admin(.*)
            context: user
            lazy: true
            form_login:
                provider: sonata_user_provider
                login_path: sonata_user_admin_security_login
                use_forward: false
                check_path: sonata_user_admin_security_check
                failure_path: ~
                default_target_path: sonata_admin_dashboard
                always_use_default_target_path: true
            logout:
                path: sonata_user_admin_security_logout
                target: /admin/login
            switch_user: { provider: sonata_user_provider }

        main:
            pattern: .*
            context: user
            lazy: true
            custom_authenticators:
                - AppBundle\Security\LoginFormAuthenticator
            logout:
                path: logout
                target: index

    password_hashers:
        UserBundle\Entity\User:
            algorithm: sha512

    access_control:
        - { path: ^/admin/login$, role: PUBLIC_ACCESS }
        - { path: ^/admin/logout$, role: PUBLIC_ACCESS }
        - { path: ^/admin/login_check$, role: PUBLIC_ACCESS }
        - { path: ^/admin/resetting, role: PUBLIC_ACCESS }
        - { path: ^/admin/, role: [ROLE_ADMIN, ROLE_SONATA_ADMIN] }
        - { path: ^/.*, role: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_SONATA_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_USER, ROLE_SONATA_ADMIN, ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH, SONATA]
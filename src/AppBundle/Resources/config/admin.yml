services:
    app.admin.menu_section:
        class: AppBundle\Admin\MenuSectionAdmin
        tags:
            - { name: sonata.admin, manager_type: orm, group: "group.menu", label: "group.menu_editor" }
        arguments:
            - ~
            - AppBundle\Entity\MenuSection
            - ~
        calls:
            - [ setTranslationDomain, [ AppBundle ] ]
    app.admin.menu_item:
        class: AppBundle\Admin\MenuItemAdmin
        tags:
            - { name: sonata.admin, manager_type: orm, group: "group.menu", label: "group.menu_item_editor", show_in_dashboard: false }
        arguments:
            - ~
            - AppBundle\Entity\MenuItem
            - ~
        calls:
            - [ setTranslationDomain, [ AppBundle ] ]

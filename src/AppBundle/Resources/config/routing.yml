# Main page ============================================
cart:
  path: /cart
  defaults:
    _controller: AppBundle\Controller\DefaultController::cartAction

step-1:
  path: /cart/step-1
  defaults:
    _controller: AppBundle\Controller\DefaultController::cartStepOneAction

step-2:
  path: /cart/step-2
  defaults:
    _controller: AppBundle\Controller\DefaultController::cartStepTwoAction

constructor:
  path: /constructor
  defaults:
    _controller: AppBundle\Controller\DefaultController::constructorAction

delivery_payment:
  path: /delivery-payment
  defaults:
    _controller: AppBundle\Controller\DefaultController::deliveryPaymentAction

search:
  path: /search
  defaults:
    _controller: AppBundle\Controller\DefaultController::searchAction

search_category:
  path: /search_category
  defaults:
    _controller: AppBundle\Controller\DefaultController::searchCategoryAction

block__ajax:
  path: /_block/ajax/{blockType}/{blockId}
  defaults:
    _controller: AppBundle\Controller\BlockController::ajaxAction
  methods: [GET, POST]
  requirements:
    blockType: .+
    blockId: .+

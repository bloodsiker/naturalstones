services:
    app.kernel.locale.subscriber:
        class: AppBundle\EventSubscriber\LocaleSubscriber
        arguments: [ '@router', '%kernel.default_locale%' ]
        tags: [ kernel.event_subscriber ]

    app.security.authentication_handler:
        class: AppBundle\Handler\AuthenticationHandler
        public: false
        arguments:
            - "@router"
            - "@session"

#    session.handler.pdo:
#        class: "Symfony\\Component\\HttpFoundation\\Session\\Storage\\Handler\\PdoSessionHandler"
#        public: false
#        arguments:
#            - 'mysql:host=%database_host%;port=%database_port%;dbname=%database_name%'
#            - { db_username: "%database_user%", db_password: "%database_password%" }
#
    app.pagerfanta.view.default:
        class: "AppBundle\\Template\\DefaultView"
        arguments:
            - '@app.pagerfanta.template.default'
            - { proximity: 9 }
        tags: [{ name: pagerfanta.view, alias: default }]

    app.pagerfanta.template.default:
        class: "AppBundle\\Template\\PagerfantaTemplate"
        calls:
            - [ 'setTranslator', ['@translator']]
            - [ 'init', ['AppBundle'] ]

    app.entity_manager:
        class: "Doctrine\\ORM\\EntityManager"
        factory: ['@doctrine', getManager]
        public: false

    app.seo.updater:
        class: "AppBundle\\Services\\SeoUpdater"
        public: true
        arguments:
            - '@sonata.page.cms_manager_selector'
            - '@sonata.seo.page'
            - '@request_stack'
            - '@translator'
            - '@router'
            - '@app.save.state.value'
#
#    app.redis.cache:
#        class: "Doctrine\\Common\\Cache\\RedisCache"
#
#    app.redis.cache.key.decorator:
#        class: "AppBundle\\Services\\RedisCacheKeyDecorator"
#        arguments:
#            - '@app.redis.cache'
#        calls:
#            - [ setNamespace, ['%secret%:app:redis:cache']]
#            - [ connect, ['%redis_host%', '%redis_port%']]
#
#
#    app.imagine.helper:
#        class: "AppBundle\\Helper\\ImagineHelper"
#        calls:
#            - [ 'setLiipImagineExtension', ['@liip_imagine.twig.extension']]
#            - [ 'setMediaCdn', ['%media_cdn_host%']]

    app.save.state.value:
        class: AppBundle\Services\SaveStateValue

    app.breadcrumb:
        class: AppBundle\Services\BreadcrumbService
        public: true

    app.send_telegram:
        class: AppBundle\Services\SendTelegramService
        public: true
        arguments:
            - '@router'
            - '@product.router.helper'
            - '@app.entity_manager'
            - '@monolog.http_client'
            - '@app.order_message.builder'
            - '@logger'
            - '%telegram_chat_id%'
            - '%telegram_channel_chat_id%'
            - '%telegram_api_url%'
            - '%telegram_token%'
            - '%full_domain%'

    app.cart:
        class: AppBundle\Services\Cart
        public: true
        arguments:
            - '@request_stack'
            - '@app.entity_manager'
            - '@security.token_storage'

    app.helper.encrypt:
        class: AppBundle\Helper\EncryptHelper
        public: true

    app.image.optimizer:
        class: AppBundle\Services\ImageOptimizer
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@request_stack'
            - '%imagine_web_root%'

    app.order_message.builder:
        class: AppBundle\Builder\OrderMessageBuilder
        arguments:
            - '@product.router.helper'
            - '%full_domain%'

    app.order_email:
        class: AppBundle\Services\OrderEmailService
        public: true
        arguments:
            - '@twig'
            - '@logger'
            - '%mailer_transport%'
            - '%mailer_host%'
            - '%mailer_user%'
            - '%mailer_password%'
            - '%order_email%'
            - '%company_name%'
            - '%full_domain%'

    # FQCN aliases needed for AbstractController::getSubscribedServices() type resolution
    AppBundle\Services\SeoUpdater: '@app.seo.updater'
    AppBundle\Services\BreadcrumbService: '@app.breadcrumb'
    AppBundle\Services\SendTelegramService: '@app.send_telegram'
    AppBundle\Services\Cart: '@app.cart'
    AppBundle\Services\OrderEmailService: '@app.order_email'
    AppBundle\Helper\EncryptHelper: '@app.helper.encrypt'

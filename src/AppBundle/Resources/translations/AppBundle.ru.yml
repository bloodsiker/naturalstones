        about_title: Изготовление и доставка украшений по миру от Naturalstones Jewerly
        description: 'Когда хочется дарить яркие эмоции и незабываемые впечатления своим родным и близким выбирайте прекрасные изделия от компании «Naturalstones Jewerly». В оговоренные сроки, с огромным трепетом и удовольствием мы сделаем и доставим вам изделие в любой город и населенный пункт мира. <br>Мы всегда идем навстречу каждому клиенту, поэтому:'
        services_1: предлагаем большой выбор изделий с камней;
        services_2: организовали лояльную ценовую политику – вы можете выбрать красивое украшение на свой бюджет;
        services_3: принимаем оплату как переводом на карту так и наложенным платежом;
        services_4: предоставляем скидки постоянным клиентам и еженедельные акции;
        services_5: всегда предлагаем исключительно качественные продукцию;
        services_6: даем исчерпывающие ответы на все ваши вопросы по ассортименту компании.
        bottom: Вы любите делать неожиданные подарки, а мы – их создавать!

    category_seo:
        faq_title: Частые вопросы
        braslety:
            h1: Браслеты из натуральных камней
            intro: <p>Выберите браслет из натурального камня для ежедневного образа, подарка или как личный символ. В каталоге есть готовые модели с аметистом, агатом, ониксом, кварцем, жемчугом, гематитом и другими минералами. Можем подобрать размер, фурнитуру и сочетание камней индивидуально.</p>
            bottom_title: Как выбрать браслет из натурального камня
            bottom: Для нежного подарка часто выбирают розовый кварц, жемчуг или лунный камень. Для сдержанного стиля подойдут оникс, гематит, обсидиан или тигровый глаз. Если браслет нужен как оберег, учитывайте не только значение камня, но и комфортный размер, цвет и фурнитуру.
            faq_1_question: Как правильно подобрать размер браслета?
            faq_1_answer: Измерьте запястье сантиметровой лентой и добавьте 0,5-1 см для комфортной посадки. Если сомневаетесь, напишите нам перед заказом.
            faq_2_question: Можно ли изменить камень или подвеску?
            faq_2_answer: "Да, многие модели можно адаптировать: изменить подвеску, фурнитуру, цветовую гамму или собрать браслет под индивидуальный запрос."
            faq_3_question: Какие браслеты лучше выбрать на подарок?
            faq_3_answer: Самые универсальные варианты - браслеты из розового кварца, аметиста, жемчуга, лунного камня, оникса или гематита.
            meta_title: Браслеты из натуральных камней купить в Украине | Naturalstones Jewerly
            meta_description: "Браслеты из натуральных камней ручной работы: аметист, агат, оникс, кварц, жемчуг, гематит. Подбор размера, индивидуальные заказы, доставка по Украине."
        kole:
            h1: Колье и чокеры из натуральных камней
            intro: <p>Колье и чокеры с натуральными камнями подходят для ежедневных образов, подарков и особых событий. Выбирайте готовые украшения с жемчугом, кварцем, агатом, аметистом и другими камнями или заказывайте индивидуальное сочетание длины, фурнитуры и подвесок.</p>
            bottom_title: Чем отличаются чокеры и колье
            bottom: Чокер плотнее ложится у шеи и хорошо смотрится с открытым вырезом, рубашками и минималистичными образами. Колье обычно имеет большую длину или более выразительную центральную часть. Для подарка лучше выбирать модели с регулировкой длины.
            faq_1_question: Можно ли изменить длину украшения?
            faq_1_answer: Да, для многих моделей можно подобрать длину или добавить удлинитель.
            faq_2_question: Какие камни выглядят наиболее нежно?
            faq_2_answer: Для нежных образов часто выбирают жемчуг, розовый кварц, лунный камень, горный хрусталь или светлый агат.
            faq_3_question: Подходит ли чокер на подарок?
            faq_3_answer: Да, но лучше выбирать модель с регулировкой, чтобы украшение комфортно село по шее.
            meta_title: Колье и чокеры из натуральных камней купить | Naturalstones Jewerly
            meta_description: Чокеры и колье из натуральных камней ручной работы. Жемчуг, кварц, агат, аметист, индивидуальная длина, доставка по Украине.
        podveski:
            h1: Подвески с натуральными камнями
            intro: <p>Подвески с натуральными камнями легко добавить к цепочке, чокеру или браслету. В каталоге есть лаконичные и акцентные варианты с разными минералами, цветами и фурнитурой. Это удобный формат подарка, когда хочется выбрать украшение с личным значением.</p>
            bottom_title: Как выбрать подвеску с камнем
            bottom: Для ежедневного ношения лучше выбирать компактные подвески с прочной фурнитурой. Для подарка можно ориентироваться на любимый цвет, знак зодиака, стиль человека или символику камня. Если нужна подвеска к уже имеющемуся украшению, обратите внимание на размер бейла и цвет металла.
            faq_1_question: Можно ли подобрать подвеску к браслету?
            faq_1_answer: Да, подберем подвеску по цвету камня, фурнитуре и стилю браслета.
            faq_2_question: Продаются ли подвески отдельно?
            faq_2_answer: Да, подвески можно заказать отдельно или добавить к другому украшению.
            faq_3_question: Какой камень выбрать для подвески на подарок?
            faq_3_answer: Чаще всего выбирают аметист, розовый кварц, лунный камень, горный хрусталь, оникс или жемчуг.
            meta_title: Подвески с натуральными камнями купить в Украине | Naturalstones Jewerly
            meta_description: Подвески с натуральными камнями для браслетов, чокеров и цепочек. Разные минералы, фурнитура, индивидуальный подбор, доставка по Украине.
        niti-oberegi:
            h1: Нити-обереги с натуральными камнями
            intro: <p>Нить-оберег с натуральным камнем - это минималистичное украшение на каждый день и символичный подарок. Можно выбрать готовый вариант или подобрать камень, цвет нити, подвеску и фурнитуру под конкретный запрос.</p>
            bottom_title: Кому подойдет нить-оберег
            bottom: Нити-обереги часто выбирают как легкое украшение для себя, близкого человека или ребенка. Они не перегружают образ и хорошо сочетаются с браслетами из камней. Значение камня можно учитывать как личную символику, но главное - комфорт, качество материалов и то, нравится ли украшение владельцу.
            faq_1_question: Можно ли выбрать цвет нити?
            faq_1_answer: Да, можно подобрать цвет нити, камень и дополнительную подвеску.
            faq_2_question: Подходит ли нить-оберег для ребенка?
            faq_2_answer: Да, но важно правильно подобрать размер и фурнитуру. Перед заказом лучше уточнить возраст и обхват запястья.
            faq_3_question: Можно ли заказать парные нити-обереги?
            faq_3_answer: Да, можно сделать парные или семейные варианты в одном стиле.
            meta_title: Нити-обереги с натуральными камнями купить | Naturalstones Jewerly
            meta_description: Нити-обереги с натуральными камнями ручной работы. Подбор камня, цвета нити, подвески и размера. Доставка по Украине.


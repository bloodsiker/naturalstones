        about_title: Виготовлення та доставка прикрас по світу від Natural Stones Jewelry
        description: 'Коли хочеться дарувати яскраві емоції та незабутні враження своїм рідним та близьким вибирайте чудові вироби від компанії Naturalstones Jewerly. У обумовлені терміни, з величезним трепетом та задоволенням ми зробимо та доставимо вам виріб у будь-яке місто та населений пункт світу. <br>Ми завжди йдемо назустріч кожному клієнту, тому:'
        services_1: пропонуємо великий вибір виробів із каменів;
        services_2: організували лояльну цінову політику - ви можете обрати гарну прикрасу на свій бюджет;
        services_3: приймаємо оплату як переказом на карту так і післяплатою;
        services_4: надаємо знижки постійним клієнтам та щотижневі акції;
        services_5: завжди пропонуємо виключно якісну продукцію;
        services_6: даємо вичерпні відповіді на всі ваші запитання щодо асортименту компанії.
        bottom: Ви любите робити несподівані подарунки, а ми - їх створювати!

    category_seo:
        faq_title: Часті питання
        braslety:
            h1: Браслети з натурального каміння
            intro: <p>Оберіть браслет з натурального каменю для щоденного носіння, подарунка або як особистий символ. У каталозі є готові моделі з аметистом, агатом, оніксом, кварцом, перлами, гематитом та іншими мінералами. Можемо підібрати розмір, фурнітуру й поєднання каменів індивідуально.</p>
            bottom_title: Як обрати браслет з натурального каменю
            bottom: Для ніжного подарунка часто обирають рожевий кварц, перли або місячний камінь. Для стриманого стилю підійдуть онікс, гематит, обсидіан або тигрове око. Якщо браслет потрібен як оберіг, звертайте увагу не лише на значення каменю, а й на комфортний розмір, колір і фурнітуру, щоб прикрасу хотілося носити щодня.
            faq_1_question: Як правильно підібрати розмір браслета?
            faq_1_answer: Виміряйте зап'ястя сантиметровою стрічкою і додайте 0,5-1 см для комфортної посадки. Якщо сумніваєтесь, напишіть нам перед замовленням.
            faq_2_question: Чи можна змінити камінь або підвіску?
            faq_2_answer: "Так, багато моделей можна адаптувати: змінити підвіску, фурнітуру, колірну гаму або зібрати браслет під індивідуальний запит."
            faq_3_question: Які браслети краще обрати на подарунок?
            faq_3_answer: Найуніверсальніші варіанти - браслети з рожевого кварцу, аметисту, перлів, місячного каменю, оніксу або гематиту. Вони легко поєднуються з різним стилем одягу.
            meta_title: Браслети з натурального каміння купити в Україні | Naturalstones Jewerly
            meta_description: "Браслети з натуральних каменів ручної роботи: аметист, агат, онікс, кварц, перли, гематит. Підбір розміру, індивідуальні замовлення, доставка по Україні."
        kole:
            h1: Кольє та чокери з натурального каміння
            intro: <p>Кольє та чокери з натуральним камінням підходять для щоденних образів, подарунків і особливих подій. Обирайте готові прикраси з перлами, кварцом, агатом, аметистом та іншими каменями або замовляйте індивідуальне поєднання довжини, фурнітури й підвісок.</p>
            bottom_title: Чим відрізняються чокери та кольє
            bottom: Чокер щільніше лягає біля шиї і добре виглядає з відкритим вирізом, сорочками та мінімалістичними образами. Кольє зазвичай має більшу довжину або виразнішу центральну частину. Для подарунка краще обирати моделі з регулюванням довжини.
            faq_1_question: Чи можна змінити довжину прикраси?
            faq_1_answer: Так, для багатьох моделей можна підібрати довжину або додати подовжувач.
            faq_2_question: Які камені виглядають найніжніше?
            faq_2_answer: Для ніжних образів часто обирають перли, рожевий кварц, місячний камінь, гірський кришталь або світлий агат.
            faq_3_question: Чи підходить чокер на подарунок?
            faq_3_answer: Так, але краще обирати модель з регулюванням, щоб прикраса комфортно сіла по шиї.
            meta_title: Кольє та чокери з натурального каміння купити | Naturalstones Jewerly
            meta_description: Чокери й кольє з натуральних каменів ручної роботи. Перли, кварц, агат, аметист, індивідуальна довжина, доставка по Україні.
        podveski:
            h1: Підвіски з натуральним камінням
            intro: <p>Підвіски з натуральним камінням легко додати до ланцюжка, чокера або браслета. У каталозі є лаконічні й акцентні варіанти з різними мінералами, кольорами та фурнітурою. Це зручний формат подарунка, коли хочеться обрати прикрасу з особистим значенням.</p>
            bottom_title: Як вибрати підвіску з каменем
            bottom: Для щоденного носіння краще обирати компактні підвіски з міцною фурнітурою. Для подарунка можна орієнтуватися на улюблений колір, знак зодіаку, стиль людини або символіку каменю. Якщо потрібна підвіска до вже наявної прикраси, зверніть увагу на розмір бейла і колір металу.
            faq_1_question: Чи можна підібрати підвіску до браслета?
            faq_1_answer: Так, підберемо підвіску за кольором каменю, фурнітурою та стилем браслета.
            faq_2_question: Чи продаються підвіски окремо?
            faq_2_answer: Так, підвіски можна замовити окремо або додати до іншої прикраси.
            faq_3_question: Який камінь обрати для підвіски на подарунок?
            faq_3_answer: Найчастіше обирають аметист, рожевий кварц, місячний камінь, гірський кришталь, онікс або перли.
            meta_title: Підвіски з натуральним камінням купити в Україні | Naturalstones Jewerly
            meta_description: Підвіски з натуральними каменями для браслетів, чокерів і ланцюжків. Різні мінерали, фурнітура, індивідуальний підбір, доставка по Україні.
        niti-oberegi:
            h1: Нитки-обереги з натуральним камінням
            intro: <p>Нитка-оберіг з натуральним каменем - це мінімалістична прикраса на кожен день і символічний подарунок. Можна обрати готовий варіант або підібрати камінь, колір нитки, підвіску та фурнітуру під конкретний запит.</p>
            bottom_title: Кому підійде нитка-оберіг
            bottom: Нитки-обереги часто обирають як легку прикрасу для себе, близької людини або дитини. Вони не перевантажують образ і добре поєднуються з браслетами з каменів. Значення каменю можна враховувати як особисту символіку, але головне - комфорт, якість матеріалів і те, чи подобається прикраса власнику.
            faq_1_question: Чи можна вибрати колір нитки?
            faq_1_answer: Так, можна підібрати колір нитки, камінь і додаткову підвіску.
            faq_2_question: Чи підходить нитка-оберіг для дитини?
            faq_2_answer: Так, але важливо правильно підібрати розмір і фурнітуру. Перед замовленням краще уточнити вік і обхват зап'ястя.
            faq_3_question: Чи можна замовити парні нитки-обереги?
            faq_3_answer: Так, можна зробити парні або сімейні варіанти в одному стилі.
            meta_title: Нитки-обереги з натуральним камінням купити | Naturalstones Jewerly
            meta_description: Нитки-обереги з натуральними каменями ручної роботи. Підбір каменю, кольору нитки, підвіски та розміру. Доставка по Україні.


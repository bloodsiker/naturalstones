services:
    comment.block.list_comments:
        class: "CommentBundle\\Block\\ListCommentBlockService"
        arguments:
          - '@twig'
          - '@app.entity_manager'
        tags:
          - { name: sonata.block }

    comment.block.add_comment:
        class: "CommentBundle\\Block\\AddCommentBlockService"
        arguments:
          - '@twig'
          - '@app.entity_manager'
          - '@request_stack'
        tags:
          - { name: sonata.block }
quick_order:
    path: /quick-order
    defaults:
        _controller: OrderBundle\Controller\OrderController::quickOrderAction

product_quick_order:
    path: /product-quick-order
    defaults:
        _controller: OrderBundle\Controller\OrderController::productQuickOrderAction

full_order:
    path: /order
    defaults:
        _controller: OrderBundle\Controller\OrderController::orderAction

success_order:
    path: /order/{secret}/success
    defaults:
        _controller: OrderBundle\Controller\OrderController::successAction
    requirements:
        secret: "[a-fA-F0-9]{40}"

services:
    share.block.tag_list:
        class: "ShareBundle\\Block\\ListTagsBlockService"
        arguments:
          - '@twig'
          - '@?doctrine'
        tags:
          - { name: sonata.block }

    share.block.stones:
        class: "ShareBundle\\Block\\StonesBlockService"
        arguments:
            - '@twig'
            - '@?doctrine'
            - '@request_stack'
        tags:
            - { name: sonata.block }

    share.block.stone_constructor:
        class: "ShareBundle\\Block\\StoneConstructorBlockService"
        arguments:
            - '@twig'
            - '@?doctrine'
            - '@request_stack'
        tags:
            - { name: sonata.block }

    share.block.zodiac:
        class: "ShareBundle\\Block\\ZodiacBlockService"
        arguments:
            - '@twig'
            - '@?doctrine'
        tags:
            - { name: sonata.block }